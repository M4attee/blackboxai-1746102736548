<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Gestione Ordini e Utenti</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
  />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-['Roboto'] min-h-screen flex flex-col items-center p-4">
  <div class="max-w-4xl w-full bg-white rounded-lg shadow-lg p-6">
    <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">Pannello Admin</h1>

    <!-- Login form -->
    <section id="login-section">
      <form id="admin-login-form" class="max-w-md mx-auto space-y-4">
        <div>
          <label for="admin-username" class="block font-medium mb-1">Nome utente</label>
          <input type="text" id="admin-username" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="admin-password" class="block font-medium mb-1">Password</label>
          <input type="password" id="admin-password" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Accedi</button>
      </form>
    </section>

    <!-- Admin content -->
    <section id="admin-content" class="hidden">
      <h2 class="text-xl font-semibold mb-4">Ordini</h2>
      <div id="orders-list" class="mb-8 overflow-auto max-h-64 border border-gray-300 rounded p-2 bg-gray-50"></div>

      <h2 class="text-xl font-semibold mb-4">Utenti Registrati</h2>
      <div id="users-list" class="overflow-auto max-h-64 border border-gray-300 rounded p-2 bg-gray-50"></div>

      <button id="logout-btn" class="mt-6 bg-red-600 text-white py-2 px-4 rounded hover:bg-red-700 transition">Logout</button>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
